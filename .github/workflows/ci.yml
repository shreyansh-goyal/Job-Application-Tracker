name: Backend CI

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::505599751031:role/github-job-tracker-ecr
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: job-application-tracker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Configure AWS credentials for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::505599751031:role/GitHubDeployViaSSM
          aws-region: ap-south-1

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/job-application-tracker:${{ github.sha }}
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=job-application-tracker" \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ubuntu/job-application-tracker\",
              \"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 505599751031.dkr.ecr.ap-south-1.amazonaws.com\",
              \"docker pull $IMAGE\",
              \"docker stop job-application-tracker || true\",
              \"docker rm job-application-tracker || true\",
              \"docker run -d --name job-application-tracker --env-file /home/ubuntu/job-application-tracker/.env -p 80:3000 --restart unless-stopped $IMAGE\",
              \"sleep 5\",
              \"curl -f http://127.0.0.1/health\"
            ]" \
            --region ap-south-1
